<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Vocabulary Quiz</title>
<style>
:root{--bg:#FAF8F3;--sage:#A8C3A0;--sage-d:#8DAE85;--mist:#B8CCD9;--card:#FFFFFF;--text:#555555;--muted:#8a8a8a;--ok:#E4F0DF;--ok-b:#A8C3A0;--bad:#F4DEDE;--bad-b:#DDA9A9;--line:#ECE8DF;--shadow:0 8px 28px rgba(120,130,110,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
.view{display:none;animation:fade .45s ease}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
header{text-align:center;margin-bottom:22px}
.logo{font-size:34px}
h1{margin:4px 0;font-size:30px;font-family:Georgia,"Noto Serif TC",serif}
.sub{color:var(--muted);margin:0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
h2{font-size:17px;margin:0 0 10px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--text)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--sage)}
input.bad{border-color:var(--bad-b);background:var(--bad)}
.pair{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:8px}
.pair .n{color:var(--muted);font-size:13px;text-align:center}
.pair .x{border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:10px;height:36px}
.pair .x:hover{background:var(--bad)}
.heads{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.count{background:var(--mist);color:#3f5565;padding:3px 12px;border-radius:99px;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.link{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;text-decoration:underline}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;background:var(--card);text-align:left;font:inherit;color:var(--text);transition:.2s}
.mode:hover{border-color:var(--mist);transform:translateY(-2px)}
.mode.sel{border-color:var(--sage);background:var(--ok)}
.mode b{display:block;font-size:16px}.mode span{font-size:13px;color:var(--muted)}
.btn{border:none;border-radius:14px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer;transition:.2s;background:var(--sage);color:#fff}
.btn:hover{background:var(--sage-d);transform:translateY(-2px);box-shadow:0 6px 14px rgba(120,150,110,.3)}
.btn.alt{background:var(--mist);color:#3f5565}.btn.alt:hover{background:#a6bece}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}.btn.ghost:hover{background:var(--bg);box-shadow:none}
.btn.sm{padding:8px 16px;font-size:14px}
.big{width:100%;font-size:17px;padding:15px}
.msg{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;display:none}
.msg.show{display:block}.msg.err{background:var(--bad)}.msg.warn{background:#F6EFD9;color:#6b5d2e}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--mist));border-radius:99px;transition:width .4s}
.q{text-align:center;padding:30px 18px}
.q small{color:var(--muted)}.q .t{font-size:40px;font-weight:700;margin-top:6px;word-break:break-word}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:14px 16px;font:inherit;font-size:18px;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--sage);transform:translateY(-2px);box-shadow:var(--shadow)}
.opt i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:14px;flex:none}
.opt:disabled{cursor:default;color:var(--text)}
.opt.ok{background:var(--ok);border-color:var(--ok-b)}.opt.no{background:var(--bad);border-color:var(--bad-b)}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;display:none;font-weight:600}
.fb.ok{display:block;background:var(--ok)}.fb.no{display:block;background:var(--bad)}
.score{text-align:center}.score .pct{font-size:56px;font-weight:700;color:var(--sage-d)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:var(--muted)}
.rec{display:flex;gap:10px;padding:11px 12px;border-radius:12px;margin-bottom:8px;font-size:15px}
.rec.ok{background:var(--ok)}.rec.no{background:var(--bad)}.rec .m{font-weight:700;flex:none}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;margin-bottom:12px}
#bulkBox{display:none;margin-top:12px}
@media(max-width:520px){.modes{grid-template-columns:1fr}.q .t{font-size:32px}h1{font-size:25px}.pair{grid-template-columns:22px 1fr 1fr 32px;gap:6px}}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="view on">
  <header><div class="logo">🌿📖</div><h1>My Vocabulary Quiz</h1><p class="sub">每天學一點英文，讓單字慢慢累積。</p></header>
  <div id="homeMsg" class="msg"></div>
  <div class="card">
    <h2>① 填寫單字與中文意思</h2>
    <div class="heads"><span></span><span>英文</span><span>中文意思</span><span></span></div>
    <div id="pairs"></div>
    <div class="row">
      <span class="count" id="count">0 組單字</span>
      <span>
        <button class="btn ghost sm" id="addRow">＋ 新增一列</button>
        <button class="btn ghost sm" id="toggleBulk">批次貼上</button>
      </span>
    </div>
    <div id="bulkBox">
      <textarea id="bulk" rows="5" placeholder="每行一組，用逗號或等號分隔，例如：&#10;apple,蘋果&#10;book=書本&#10;ice cream，冰淇淋"></textarea>
      <div class="row"><span class="hint">按「加入清單」後會加到上方列表</span><button class="btn alt sm" id="bulkAdd">加入清單</button></div>
    </div>
    <p class="hint">至少需要 4 組。重複的英文會自動合併，多餘空格會自動移除。
      <button class="link" id="sample">填入範例</button> · <button class="link" id="clear">清空全部</button></p>
  </div>
  <div class="card">
    <h2>② 選擇測驗模式</h2>
    <div class="modes">
      <button class="mode sel" data-mode="zh2en"><b>中文 → 英文</b><span>看中文，選英文單字</span></button>
      <button class="mode" data-mode="en2zh"><b>英文 → 中文</b><span>看英文，選中文意思</span></button>
    </div>
  </div>
  <button class="btn big" id="start">開始測驗</button>
</section>

<section id="quiz" class="view">
  <div class="top"><b id="prog">1 / 10</b><button class="btn ghost" id="quitQuiz">返回首頁</button></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="card q"><small id="qLabel"></small><div class="t" id="qText"></div></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb" role="status" aria-live="polite"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="next" style="display:none">下一題</button></div>
  <p class="hint" style="text-align:center">小提示：可按鍵盤 1～4 或 A～D 作答</p>
</section>

<section id="result" class="view">
  <header><div class="logo">🌱</div><h1>測驗成績</h1></header>
  <div class="card score">
    <div class="pct" id="rPct"></div><div id="rMsg" style="font-weight:600"></div>
    <div class="stats"><div class="stat"><b id="rTotal"></b><span>總題數</span></div><div class="stat"><b id="rOk"></b><span>答對</span></div><div class="stat"><b id="rBad"></b><span>答錯</span></div></div>
  </div>
  <div class="card">
    <h2>作答紀錄</h2>
    <label class="chk"><input type="checkbox" id="onlyWrong"> 只看答錯的題目</label>
    <div id="records"></div>
  </div>
  <div class="acts">
    <button class="btn" id="again">再測一次</button>
    <button class="btn" id="retryWrong" style="display:none">只重測答錯的題目</button>
    <button class="btn alt" id="switch">切換模式再測</button>
    <button class="btn ghost" id="toHome">返回首頁</button>
  </div>
</section>

</div>
<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const clean=s=>s.replace(/\s+/g," ").trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const show=v=>{document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id===v));window.scrollTo(0,0)};
function msg(text,type){const e=$("homeMsg");e.className="msg "+type+(text?" show":"");e.innerHTML=text}

let mode="zh2en",pairs=[{en:"",zh:""}],questions=[],idx=0,answers=[],locked=false,pool=[];

/* ---------- 單字列表 ---------- */
function save(){store.set("vq_pairs",JSON.stringify(pairs))}
function filled(){return pairs.filter(p=>clean(p.en)&&clean(p.zh)).length}
function updateCount(){$("count").textContent=filled()+" 組單字"}
function renderPairs(focusLast){
  const box=$("pairs");box.innerHTML="";
  pairs.forEach((p,i)=>{
    const r=document.createElement("div");r.className="pair";
    r.innerHTML='<span class="n">'+(i+1)+'</span><input type="text" data-k="en" placeholder="apple" autocapitalize="off" spellcheck="false"><input type="text" data-k="zh" placeholder="蘋果"><button class="x" title="刪除這列" aria-label="刪除這列">✕</button>';
    const [en,zh]=r.querySelectorAll("input");
    en.value=p.en;zh.value=p.zh;
    [en,zh].forEach(inp=>inp.addEventListener("input",()=>{
      p[inp.dataset.k]=inp.value;inp.classList.remove("bad");save();updateCount();
    }));
    en.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();zh.focus()}});
    zh.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();
      if(i===pairs.length-1){pairs.push({en:"",zh:""});renderPairs(true)}else box.children[i+1].querySelector("input").focus()}});
    r.querySelector(".x").onclick=()=>{pairs.splice(i,1);if(!pairs.length)pairs.push({en:"",zh:""});save();renderPairs()};
    box.appendChild(r);
  });
  if(focusLast)box.lastChild.querySelector("input").focus();
  updateCount();
}
function parseBulk(text){
  const out=[],bad=[];
  text.split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    let m=line.match(/^(.+?)\s*[=＝,，\t:：]\s*(.+)$/)||line.match(/^([A-Za-z][A-Za-z' -]*?)\s+([\u4e00-\u9fff].*)$/);
    if(m)out.push({en:clean(m[1]),zh:clean(m[2])});else bad.push(line);
  });
  return{out,bad};
}

/* ---------- 開始測驗 ---------- */
function begin(){
  msg("","err");
  document.querySelectorAll(".pair input").forEach(i=>i.classList.remove("bad"));
  const rows=$("pairs").children,problems=[];
  const seen=new Set(),valid=[],dups=[];
  pairs.forEach((p,i)=>{
    const en=clean(p.en),zh=clean(p.zh);
    if(!en&&!zh)return;
    if(!en||!zh){
      problems.push("第 "+(i+1)+" 列"+(en?"缺少中文意思":"缺少英文單字"));
      rows[i].querySelector('input[data-k="'+(en?"zh":"en")+'"]').classList.add("bad");return;
    }
    if(/[\u4e00-\u9fff]/.test(en)){problems.push("第 "+(i+1)+" 列的英文欄位含有中文");rows[i].querySelector('input[data-k="en"]').classList.add("bad");return}
    const k=en.toLowerCase();
    if(seen.has(k)){dups.push(en);return}
    seen.add(k);valid.push({en:k===en?en:en,zh});
  });
  if(problems.length){msg("請先修正：<br>"+problems.join("<br>"),"err");return}
  if(!valid.length){msg("請先輸入英文單字和中文意思。","err");return}
  if(valid.length<4){msg("目前只有 "+valid.length+" 組單字，至少需要 4 組才能產生四選一的題目。","err");return}
  pool=valid;
  const note=dups.length?"已自動略過重複的英文單字："+dups.join("、"):"";
  msg(note,"warn");
  startQuiz();
}
function startQuiz(subset){
  const base=subset&&subset.length?subset:pool,key=mode==="zh2en"?"en":"zh";
  questions=shuffle(base).map(item=>{
    const seen=new Set([item[key].toLowerCase()]),d=[];
    shuffle(pool).forEach(o=>{
      if(d.length<3&&o.en!==item.en&&o.zh!==item.zh&&!seen.has(o[key].toLowerCase())){seen.add(o[key].toLowerCase());d.push(o[key])}
    });
    return{item,ans:item[key],prompt:mode==="zh2en"?item.zh:item.en,options:shuffle([item[key],...d])};
  }).filter(q=>q.options.length===4);
  if(!questions.length){msg("相同的內容太多，無法產生四個不重複的選項。請多加入一些不同的單字。","err");show("home");return}
  idx=0;answers=[];show("quiz");render();
}
function render(){
  locked=false;const q=questions[idx];
  $("prog").textContent=(idx+1)+" / "+questions.length;
  $("barFill").style.width=(idx/questions.length*100)+"%";
  $("qLabel").textContent=mode==="zh2en"?"請選出正確的英文單字":"請選出正確的中文意思";
  $("qText").textContent=q.prompt;
  const box=$("opts");box.innerHTML="";
  q.options.forEach((o,i)=>{
    const b=document.createElement("button");b.className="opt";b.dataset.val=o;
    b.innerHTML='<i>'+"ABCD"[i]+'</i><span></span>';b.lastChild.textContent=mode==="zh2en"?cap(o):o;
    b.onclick=()=>choose(b,o);box.appendChild(b);
  });
  $("fb").className="fb";$("fb").textContent="";$("next").style.display="none";
  $("next").textContent=idx===questions.length-1?"查看成績":"下一題";
}
function choose(btn,val){
  if(locked)return;locked=true;
  const q=questions[idx],right=val===q.ans;
  answers.push({item:q.item,q:q.prompt,ans:q.ans,pick:val,right});
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.val===q.ans)b.classList.add("ok")});
  if(!right)btn.classList.add("no");
  const fb=$("fb");fb.className="fb "+(right?"ok":"no");
  fb.textContent=right?"✓ 答對了！":"✗ 答錯了，正確答案是："+(mode==="zh2en"?cap(q.ans):q.ans);
  $("barFill").style.width=((idx+1)/questions.length*100)+"%";
  const n=$("next");n.style.display="";n.focus();
}
function nextQ(){if(idx<questions.length-1){idx++;render()}else showResult()}

/* ---------- 成績 ---------- */
function showResult(){
  const total=answers.length,ok=answers.filter(a=>a.right).length,pct=Math.round(ok/total*100);
  $("rTotal").textContent=total;$("rOk").textContent=ok;$("rBad").textContent=total-ok;$("rPct").textContent=pct+"%";
  $("rMsg").textContent=pct===100?"太棒了，全部答對！🌟":pct>=80?"很不錯，繼續保持！":pct>=60?"還可以，再複習一下就更好了。":"別灰心，多練習幾次就會進步。";
  $("retryWrong").style.display=ok<total?"":"none";
  $("onlyWrong").checked=false;renderRecords();show("result");
}
function renderRecords(){
  const only=$("onlyWrong").checked,box=$("records");box.innerHTML="";
  const list=answers.map((a,i)=>({...a,i})).filter(a=>!only||!a.right);
  if(!list.length){box.innerHTML='<p class="hint">沒有答錯的題目，太厲害了！🌿</p>';return}
  const sh=mode==="zh2en"?cap:(x=>x);
  list.forEach(a=>{
    const d=document.createElement("div");d.className="rec "+(a.right?"ok":"no");
    d.innerHTML='<span class="m">'+(a.right?"✓":"✗")+'</span><div></div>';
    d.lastChild.textContent=(a.i+1)+". "+(mode==="zh2en"?a.q:cap(a.q))+" → 正確答案："+sh(a.ans)+(a.right?"":"　｜　你的答案："+sh(a.pick));
    box.appendChild(d);
  });
}

/* ---------- 事件 ---------- */
function setMode(m){mode=m;store.set("vq_mode",m);document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("sel",b.dataset.mode===m))}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("addRow").onclick=()=>{pairs.push({en:"",zh:""});save();renderPairs(true)};
$("toggleBulk").onclick=()=>{const b=$("bulkBox");b.style.display=b.style.display==="block"?"none":"block"};
$("bulkAdd").onclick=()=>{
  const {out,bad}=parseBulk($("bulk").value);
  if(!out.length){msg("沒有讀到可用的內容。請每行用「英文,中文」或「英文=中文」的格式。","err");return}
  pairs=pairs.filter(p=>clean(p.en)||clean(p.zh)).concat(out);
  $("bulk").value="";save();renderPairs();
  msg(bad.length?"已加入 "+out.length+" 組。以下行格式不正確，已略過：<br>"+bad.join("<br>"):"已加入 "+out.length+" 組單字。",bad.length?"warn":"warn");
};
$("sample").onclick=()=>{
  pairs=[["apple","蘋果"],["book","書本"],["happy","快樂"],["water","水"],["beautiful","美麗的"]].map(([en,zh])=>({en,zh}));
  save();renderPairs();msg("","err");
};
$("clear").onclick=()=>{pairs=[{en:"",zh:""}];save();renderPairs();msg("","err")};
$("start").onclick=begin;
$("next").onclick=nextQ;
$("quitQuiz").onclick=()=>show("home");
$("toHome").onclick=()=>show("home");
$("again").onclick=()=>startQuiz();
$("retryWrong").onclick=()=>startQuiz(answers.filter(a=>!a.right).map(a=>a.item));
$("switch").onclick=()=>{setMode(mode==="zh2en"?"en2zh":"zh2en");startQuiz()};
$("onlyWrong").onchange=renderRecords;
document.addEventListener("keydown",e=>{
  if(!$("quiz").classList.contains("on")||locked||e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;
  const k=e.key.toUpperCase(),i="1234".indexOf(k)>=0?"1234".indexOf(k):"ABCD".indexOf(k);
  const o=document.querySelectorAll(".opt")[i];if(i>=0&&o)o.click();
});

(function init(){
  try{const p=JSON.parse(store.get("vq_pairs")||"null");if(Array.isArray(p)&&p.length)pairs=p.map(x=>({en:String(x.en||""),zh:String(x.zh||"")}))}catch(e){}
  if(!store.get("vq_pairs"))pairs=[["apple","蘋果"],["book","書本"],["happy","快樂"],["water","水"],["beautiful","美麗的"]].map(([en,zh])=>({en,zh}));
  setMode(store.get("vq_mode")==="en2zh"?"en2zh":"zh2en");
  renderPairs();
})();
</script>
</body>
</html>
