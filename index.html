<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單字探索器</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1f1d1a;--muted:#78736b;--line:#e8e3da;--accent:#c2562b;--syn:#e3f1e6;--syn-t:#1d5a2e;--ant:#fbe6e1;--ant-t:#8a2f1a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a18;--card:#262320;--text:#f0ece5;--muted:#a09a90;--line:#38342f;--accent:#e8825a;--syn:#1f3a27;--syn-t:#9fd9ae;--ant:#43241d;--ant-t:#f0aa9a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;line-height:1.55;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{font-family:inherit}
button.go{font-size:16px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h2{font-size:13px;letter-spacing:.04em;color:var(--muted);margin:0 0 10px;font-weight:600}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.word{font-size:28px;font-weight:700;margin:0}
.pos{color:var(--muted);font-size:14px}
.zhw{font-size:18px;color:var(--accent);font-weight:600}
.sp{border:0;background:var(--line);color:var(--text);border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;flex:none;padding:0}
.sp.big{width:40px;height:40px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.cw{display:inline-flex;align-items:stretch;border-radius:14px;overflow:hidden}
.chip{border:0;padding:6px 12px;font-size:15px;text-align:left;cursor:pointer}
.chip small{display:block;font-size:12px;opacity:.8;min-height:1.2em}
.cw .sp{border-radius:0;width:30px;height:auto;background:transparent;opacity:.8}
.cw.syn{background:var(--syn);color:var(--syn-t)}
.cw.ant{background:var(--ant);color:var(--ant-t)}
.cw .chip{background:transparent;color:inherit}
.cw .sp{color:inherit}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
li:first-child{border-top:0;padding-top:0}
li .t{flex:1;font-size:16px}
li small{display:block;color:var(--muted);font-size:13px;min-height:1.2em}
.msg{color:var(--muted);text-align:center;padding:24px 0}
.err{color:var(--ant-t);background:var(--ant);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>單字探索器</h1>
  <p class="sub">輸入英文單字，取得發音、同義詞、反義詞（含中文）與簡單英文描述</p>
  <div class="row">
    <input id="q" type="text" placeholder="例如：happy" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="go" id="go">查詢</button>
  </div>
  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const out = $("out"), q = $("q"), go = $("go");

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const art = w => (/^[aeiou]/i.test(w) ? "an " : "a ");

async function getJSON(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const safe = p => p.catch(() => null);

/* ---------- 發音 ---------- */
let currentAudio = null;
function speak(text){
  try {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function playWord(word, audioUrl){
  if (audioUrl) {
    try {
      speechSynthesis.cancel();
      currentAudio = new Audio(audioUrl);
      currentAudio.play().catch(() => speak(word));
      return;
    } catch (e) {}
  }
  speak(word);
}

/* ---------- 翻譯（英 → 繁中） ---------- */
async function translate(texts){
  const map = {};
  const list = [...new Set(texts.map(t => t.trim()).filter(Boolean))];
  if (!list.length) return map;
  try {
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=" +
      encodeURIComponent(list.join("\n"));
    const data = await getJSON(url);
    (data[0] || []).forEach(seg => {
      if (seg && seg[0] && seg[1]) map[seg[1].trim()] = seg[0].trim();
    });
  } catch (e) {}
  const missing = list.filter(t => !map[t]).slice(0, 30);   // 備援：MyMemory
  await Promise.all(missing.map(async t => {
    try {
      const d = await getJSON("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(t) + "&langpair=en|zh-TW");
      const tr = d && d.responseData && d.responseData.translatedText;
      if (tr && !/MYMEMORY|QUERY LENGTH|INVALID/i.test(tr)) map[t] = tr;
    } catch (e) {}
  }));
  return map;
}

/* ---------- 查詢 ---------- */
const POSZH = { n: "名詞", v: "動詞", adj: "形容詞", adv: "副詞" };
const POSMAP = { noun: "n", verb: "v", adjective: "adj", adverb: "adv" };
const freq = x => { const t = (x.tags || []).find(s => s.startsWith("f:")); return t ? parseFloat(t.slice(2)) : 0; };

function dedupe(items, skip){
  const seen = new Set([skip]);
  return items.filter(x => x && x.word && !seen.has(x.word.toLowerCase()) && seen.add(x.word.toLowerCase()));
}

async function lookup(word){
  const w = encodeURIComponent(word);
  const [dict, syn, ant, me] = await Promise.all([
    safe(getJSON("https://api.dictionaryapi.dev/api/v2/entries/en/" + w)),
    safe(getJSON("https://api.datamuse.com/words?rel_syn=" + w + "&md=f&max=30")),
    safe(getJSON("https://api.datamuse.com/words?rel_ant=" + w + "&md=f&max=20")),
    safe(getJSON("https://api.datamuse.com/words?sp=" + w + "&md=p&max=1"))
  ]);

  const lw = word.toLowerCase();
  const syns = (syn || []).map(x => ({ word: x.word, f: freq(x) }));
  const ants = (ant || []).map(x => ({ word: x.word, f: freq(x) }));
  const defs = [];
  let pos = "";
  let audio = "";
  let phonetic = (dict && dict[0] && dict[0].phonetic) || "";

  (dict || []).forEach(entry => {
    (entry.phonetics || []).forEach(p => {
      if (!audio && p.audio) audio = p.audio.startsWith("//") ? "https:" + p.audio : p.audio;
      if (!phonetic && p.text) phonetic = p.text;
    });
    (entry.meanings || []).forEach(m => {
      if (!pos) pos = POSMAP[m.partOfSpeech] || "";
      (m.synonyms || []).forEach(s => syns.push({ word: s, f: 0 }));
      (m.antonyms || []).forEach(s => ants.push({ word: s, f: 0 }));
      (m.definitions || []).slice(0, 3).forEach(d => {
        defs.push({ pos: m.partOfSpeech, text: d.definition });
        (d.synonyms || []).forEach(s => syns.push({ word: s, f: 0 }));
        (d.antonyms || []).forEach(s => ants.push({ word: s, f: 0 }));
      });
    });
  });
  if (!pos && me && me[0] && me[0].tags) {
    const t = me[0].tags.find(x => ["n", "v", "adj", "adv"].includes(x));
    if (t) pos = t;
  }

  const synonyms = dedupe(syns, lw).slice(0, 12);
  const antonyms = dedupe(ants, lw).slice(0, 10);
  if (!(dict && dict.length) && !synonyms.length && !antonyms.length) return null;

  return {
    word: (dict && dict[0] && dict[0].word) || word,
    phonetic, audio, pos,
    defs: defs,
    synonyms, antonyms,
    sentences: simpleSentences(lw, pos, dedupe(syns, lw), dedupe(ants, lw), defs)
  };
}

/* 用簡短定義與最常用的同義/反義詞，組成描述這個單字的短句 */
function simpleSentences(w, pos, syns, ants, defs){
  const basic = list => {
    const common = list.filter(x => x.f >= 3).sort((a, b) => b.f - a.f);
    const rest = list.filter(x => x.f < 3);
    return [...common, ...rest].map(x => x.word).slice(0, 3);
  };
  const S = basic(syns), A = basic(ants);
  const W = cap(w), out = [];

  const clean = t => t.replace(/\s+/g, " ").replace(/[.;:]+$/, "").trim();
  const wc = t => t.split(" ").length;
  let cands = [...new Set(defs.map(d => clean(d.text)))].sort((a, b) => a.length - b.length);
  let shortDefs = cands.filter(t => wc(t) <= 14).slice(0, 3);
  if (!shortDefs.length && cands.length) shortDefs = [cands[0]];
  shortDefs.forEach(t => out.push(`${W} means “${t.charAt(0).toLowerCase() + t.slice(1)}”.`));

  if (S[1]) out.push(`You can also say “${S[0]}” or “${S[1]}”.`);
  else if (S[0]) out.push(`You can also say “${S[0]}”.`);
  if (A[0]) out.push(`The opposite is “${A[0]}”.`);
  return out.slice(0, 5);
}

/* ---------- 畫面 ---------- */
const chips = (list, cls) => list.length
  ? '<div class="chips">' + list.map(x =>
      '<span class="cw ' + cls + '"><button class="chip" data-w="' + esc(x.word) + '">' + esc(x.word) +
      '<small class="zh" data-t="' + esc(x.word) + '"></small></button>' +
      '<button class="sp" data-s="' + esc(x.word) + '" aria-label="發音">🔊</button></span>').join("") + '</div>'
  : '<span class="pos">（找不到）</span>';

function render(d){
  let html = '<div class="card"><div class="head"><p class="word">' + esc(d.word) + '</p>' +
    '<button class="sp big" id="mainsp" aria-label="發音">🔊</button>' +
    '<span class="zhw zh" data-t="' + esc(d.word) + '"></span></div>' +
    '<div class="pos">' + (d.pos ? POSZH[d.pos] : "") + (d.pos && d.phonetic ? "　" : "") + esc(d.phonetic || "") + '</div></div>';
  html += '<div class="card"><h2>同義詞</h2>' + chips(d.synonyms, "syn") + '</div>';
  html += '<div class="card"><h2>反義詞</h2>' + chips(d.antonyms, "ant") + '</div>';
  html += '<div class="card"><h2>簡單說明</h2>' + (d.sentences.length
    ? '<ul>' + d.sentences.map(s =>
        '<li><div class="t">' + esc(s) + '<small class="zh" data-t="' + esc(s) + '"></small></div>' +
        '<button class="sp" data-s="' + esc(s) + '" aria-label="發音">🔊</button></li>').join("") + '</ul>'
    : '<span class="pos">（資料不足，無法產生說明）</span>') + '</div>';
  out.innerHTML = html;
  $("mainsp").addEventListener("click", () => playWord(d.word, d.audio));
}

async function fillTranslations(d){
  const texts = [d.word, ...d.synonyms.map(x => x.word), ...d.antonyms.map(x => x.word), ...d.sentences];
  const map = await translate(texts);
  out.querySelectorAll(".zh").forEach(el => { el.textContent = map[el.dataset.t] || ""; });
}

let token = 0;
async function search(word){
  word = (word || "").trim().split(/\s+/)[0];
  if (!word) return;
  q.value = word;
  const my = ++token;
  go.disabled = true;
  out.innerHTML = '<div class="msg">查詢中…</div>';
  try {
    const d = await lookup(word);
    if (my !== token) return;
    if (!d) { out.innerHTML = '<div class="err">找不到「' + esc(word) + '」，請確認拼字。</div>'; return; }
    render(d);
    fillTranslations(d);
  } catch (e) {
    out.innerHTML = '<div class="err">查詢失敗，請確認網路連線後再試。</div>';
  } finally {
    go.disabled = false;
  }
}

go.addEventListener("click", () => search(q.value));
q.addEventListener("keydown", e => { if (e.key === "Enter") search(q.value); });
out.addEventListener("click", e => {
  const sp = e.target.closest("[data-s]");
  if (sp) { speak(sp.dataset.s); return; }
  const b = e.target.closest(".chip");
  if (b) { search(b.dataset.w); window.scrollTo({ top: 0, behavior: "smooth" }); }
});
</script>
</body>
</html>
