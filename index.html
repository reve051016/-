<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Vocabulary Quiz</title>
<style>
:root{--bg:#FAF8F3;--sage:#A8C3A0;--sage-d:#8DAE85;--mist:#B8CCD9;--card:#FFFFFF;--text:#555555;--muted:#8a8a8a;--ok:#E4F0DF;--ok-b:#A8C3A0;--bad:#F4DEDE;--bad-b:#DDA9A9;--line:#ECE8DF;--shadow:0 8px 28px rgba(120,130,110,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2d29;--card:#353a34;--text:#e6e6e0;--muted:#aaa;--ok:#3c4d38;--bad:#53393a;--line:#454b43;--shadow:0 8px 28px rgba(0,0,0,.3);color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
.view{display:none;animation:fade .45s ease}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
header{text-align:center;margin-bottom:22px}
.logo{font-size:34px}
h1{margin:4px 0 4px;font-size:30px;letter-spacing:.5px;font-family:Georgia,"Noto Serif TC",serif}
.sub{color:var(--muted);margin:0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
h2{font-size:17px;margin:0 0 10px}
textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:14px;padding:14px;font:inherit;background:var(--bg);color:var(--text);resize:vertical}
textarea:focus{outline:none;border-color:var(--sage)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.count{background:var(--mist);color:#3f5565;padding:3px 12px;border-radius:99px;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.link{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;text-decoration:underline}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;background:var(--card);text-align:left;font:inherit;color:var(--text);transition:.2s}
.mode:hover{border-color:var(--mist);transform:translateY(-2px)}
.mode.sel{border-color:var(--sage);background:var(--ok)}
.mode b{display:block;font-size:16px}.mode span{font-size:13px;color:var(--muted)}
.btn{border:none;border-radius:14px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer;transition:.2s;background:var(--sage);color:#fff}
.btn:hover{background:var(--sage-d);transform:translateY(-2px);box-shadow:0 6px 14px rgba(120,150,110,.3)}
.btn.alt{background:var(--mist);color:#3f5565}.btn.alt:hover{background:#a6bece;box-shadow:0 6px 14px rgba(100,130,150,.25)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}.btn.ghost:hover{background:var(--bg);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.btn:focus-visible,.opt:focus-visible,.mode:focus-visible{outline:3px solid var(--mist);outline-offset:2px}
.big{width:100%;font-size:17px;padding:15px}
.msg{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px;display:none}
.msg.show{display:block}.msg.err{background:var(--bad)}.msg.warn{background:#F6EFD9;color:#6b5d2e}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--mist));border-radius:99px;transition:width .4s}
.q{text-align:center;padding:30px 18px}
.q small{color:var(--muted)}.q .t{font-size:40px;font-weight:700;margin-top:6px;word-break:break-word}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:14px 16px;font:inherit;font-size:18px;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--sage);transform:translateY(-2px);box-shadow:var(--shadow)}
.opt i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:14px;flex:none}
.opt:disabled{cursor:default;color:var(--text)}
.opt.ok{background:var(--ok);border-color:var(--ok-b)}.opt.no{background:var(--bad);border-color:var(--bad-b)}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;display:none;font-weight:600}
.fb.ok{display:block;background:var(--ok)}.fb.no{display:block;background:var(--bad)}
.score{text-align:center}.score .pct{font-size:56px;font-weight:700;color:var(--sage-d)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:var(--muted)}
.rec{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;margin-bottom:8px;font-size:15px}
.rec.ok{background:var(--ok)}.rec.no{background:var(--bad)}
.rec .m{font-weight:700;flex:none}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;margin-bottom:12px}
@media(max-width:520px){.modes{grid-template-columns:1fr}.q .t{font-size:32px}h1{font-size:25px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="view on">
  <header><div class="logo">🌿📖</div><h1>My Vocabulary Quiz</h1><p class="sub">每天學一點英文，讓單字慢慢累積。</p></header>
  <div id="homeMsg" class="msg" role="status"></div>
  <div class="card">
    <h2>① 輸入英文單字</h2>
    <textarea id="words" placeholder="用逗號或換行分隔，例如：&#10;apple, book, happy, water, beautiful" spellcheck="false"></textarea>
    <div class="row"><span class="count" id="count">0 個單字</span>
      <span><button class="link" id="sample">填入範例</button> · <button class="link" id="clear">清空</button></span></div>
    <p class="hint">至少需要 4 個單字。進階：也可自訂意思，如 <code>serendipity=機緣巧合</code>。</p>
  </div>
  <div class="card">
    <h2>② 選擇測驗模式</h2>
    <div class="modes">
      <button class="mode sel" data-mode="zh2en"><b>中文 → 英文</b><span>看中文，選英文單字</span></button>
      <button class="mode" data-mode="en2zh"><b>英文 → 中文</b><span>看英文，選中文意思</span></button>
    </div>
  </div>
  <button class="btn big" id="start">開始測驗</button>
</section>

<section id="quiz" class="view">
  <div id="quizMsg" class="msg warn"></div>
  <div class="top"><b id="prog">1 / 10</b><button class="btn ghost" id="quitQuiz">返回首頁</button></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="card q"><small id="qLabel"></small><div class="t" id="qText"></div></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb" role="status" aria-live="polite"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="next" style="display:none">下一題</button></div>
  <p class="hint" style="text-align:center">小提示：可按鍵盤 1～4 或 A～D 作答</p>
</section>

<section id="result" class="view">
  <header><div class="logo">🌱</div><h1>測驗成績</h1></header>
  <div class="card score">
    <div class="pct" id="rPct"></div><div id="rMsg" style="font-weight:600"></div>
    <div class="stats"><div class="stat"><b id="rTotal"></b><span>總題數</span></div><div class="stat"><b id="rOk"></b><span>答對</span></div><div class="stat"><b id="rBad"></b><span>答錯</span></div></div>
  </div>
  <div class="card">
    <h2>作答紀錄</h2>
    <label class="chk"><input type="checkbox" id="onlyWrong"> 只看答錯的題目</label>
    <div id="records"></div>
  </div>
  <div class="acts">
    <button class="btn" id="again">再測一次</button>
    <button class="btn" id="retryWrong" style="display:none">只重測答錯的題目</button>
    <button class="btn alt" id="switch">切換模式再測</button>
    <button class="btn ghost" id="toHome">返回首頁</button>
  </div>
</section>

</div>
<script>
const DICT_RAW="apple:蘋果,book:書本,happy:快樂,water:水,beautiful:美麗的,cat:貓,dog:狗,house:房子,car:汽車,tree:樹,flower:花,sun:太陽,moon:月亮,star:星星,sky:天空,sea:海,river:河流,mountain:山,rain:雨,snow:雪,wind:風,fire:火,earth:地球,friend:朋友,family:家庭,mother:母親,father:父親,brother:兄弟,sister:姊妹,child:孩子,man:男人,woman:女人,teacher:老師,student:學生,doctor:醫生,school:學校,classroom:教室,library:圖書館,hospital:醫院,city:城市,country:國家,world:世界,room:房間,door:門,window:窗戶,table:桌子,chair:椅子,bed:床,kitchen:廚房,food:食物,bread:麵包,rice:米飯,milk:牛奶,egg:蛋,meat:肉,fish:魚,chicken:雞肉,fruit:水果,banana:香蕉,orange:柳橙,grape:葡萄,lemon:檸檬,strawberry:草莓,vegetable:蔬菜,potato:馬鈴薯,tomato:番茄,coffee:咖啡,tea:茶,juice:果汁,sugar:糖,salt:鹽,breakfast:早餐,lunch:午餐,dinner:晚餐,red:紅色,blue:藍色,green:綠色,yellow:黃色,black:黑色,white:白色,pink:粉紅色,purple:紫色,brown:棕色,big:大的,small:小的,long:長的,short:短的,tall:高的,high:高的,low:低的,fast:快的,slow:慢的,hot:熱的,cold:冷的,warm:溫暖的,cool:涼爽的,new:新的,old:舊的,young:年輕的,good:好的,bad:壞的,sad:悲傷的,angry:生氣的,tired:疲倦的,hungry:飢餓的,busy:忙碌的,easy:容易的,difficult:困難的,important:重要的,interesting:有趣的,funny:好笑的,kind:親切的,smart:聰明的,quiet:安靜的,clean:乾淨的,dirty:骯髒的,rich:富有的,poor:貧窮的,strong:強壯的,weak:虛弱的,safe:安全的,dangerous:危險的,free:自由的,ready:準備好的,run:跑,walk:走路,jump:跳,swim:游泳,fly:飛,eat:吃,drink:喝,sleep:睡覺,wake:醒來,sit:坐,stand:站立,read:閱讀,write:寫,speak:說話,listen:聽,look:看,watch:觀看,see:看見,hear:聽見,think:思考,know:知道,learn:學習,study:研讀,teach:教,understand:了解,remember:記得,forget:忘記,love:愛,like:喜歡,hate:討厭,want:想要,need:需要,help:幫助,give:給,take:拿,make:製作,buy:購買,sell:賣,open:打開,close:關閉,start:開始,finish:完成,come:來,go:去,play:玩,work:工作,sing:唱歌,dance:跳舞,cook:烹飪,draw:畫,paint:粉刷,travel:旅行,visit:拜訪,meet:遇見,wait:等待,try:嘗試,ask:詢問,answer:回答,call:呼叫,smile:微笑,laugh:大笑,cry:哭泣,time:時間,day:日,night:夜晚,morning:早晨,afternoon:下午,evening:傍晚,week:週,month:月份,year:年,today:今天,tomorrow:明天,yesterday:昨天,spring:春天,summer:夏天,autumn:秋天,winter:冬天,money:金錢,price:價格,market:市場,shop:商店,store:商店,restaurant:餐廳,hotel:旅館,airport:機場,station:車站,street:街道,road:道路,bridge:橋,park:公園,garden:花園,farm:農場,bus:公車,train:火車,bike:腳踏車,boat:船,plane:飛機,ticket:票,map:地圖,phone:電話,computer:電腦,internet:網際網路,television:電視,music:音樂,movie:電影,picture:圖片,photo:照片,game:遊戲,sport:運動,ball:球,team:團隊,song:歌曲,story:故事,letter:信,paper:紙,pen:筆,pencil:鉛筆,bag:包包,box:盒子,key:鑰匙,clock:時鐘,shoe:鞋子,hat:帽子,shirt:襯衫,dress:洋裝,coat:外套,glasses:眼鏡,head:頭,eye:眼睛,ear:耳朵,nose:鼻子,mouth:嘴巴,hand:手,foot:腳,heart:心,face:臉,hair:頭髮,body:身體,health:健康,life:生命,dream:夢想,idea:想法,question:問題,problem:難題,word:單字,language:語言,name:名字,number:數字,color:顏色,shape:形狀,light:光,shadow:影子,peace:和平,hope:希望,truth:真相,power:力量,energy:能量,nature:自然,animal:動物,bird:鳥,horse:馬,cow:牛,pig:豬,rabbit:兔子,monkey:猴子,elephant:大象,lion:獅子,tiger:老虎,bear:熊,insect:昆蟲,butterfly:蝴蝶,forest:森林,grass:草,leaf:葉子,island:島嶼,beach:海灘,lake:湖,ocean:海洋,stone:石頭,gold:黃金,silver:銀,glass:玻璃,wood:木頭,knowledge:知識,education:教育,culture:文化,history:歷史,science:科學,art:藝術,business:商業,company:公司,office:辦公室,job:職業,future:未來,past:過去,memory:記憶,experience:經驗,adventure:冒險,journey:旅程,success:成功,change:改變,choice:選擇,reason:原因,message:訊息,secret:祕密,gift:禮物,holiday:假日,birthday:生日,wedding:婚禮,party:派對";
const DICT={};
DICT_RAW.split(",").forEach(p=>{const[i,j]=p.split(":");if(!(i in DICT))DICT[i]=j});

const $=id=>document.getElementById(id);
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
let mode="zh2en",questions=[],idx=0,answers=[],locked=false,pool=[],lastNote="";

const show=v=>{
  document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id===v));
  window.scrollTo(0,0);
};
const shuffle=a=>{
  a=a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
};
function msg(id,text,type){
  const e=$(id);
  e.className="msg "+type+(text?" show":"");
  e.innerHTML=text;
}

/* ---------- 輸入處理 ---------- */
function parseInput(){
  const seen=new Set(),out=[];
  $("words").value.split(/[,，、;；\n\r]+/).forEach(s=>{
    s=s.trim();if(!s)return;
    let custom=null;
    const m=s.split(/[=＝]/);
    if(m.length>1){s=m[0].trim();custom=m.slice(1).join("=").trim()}
    const w=s.toLowerCase().replace(/\s+/g," ");
    if(!/^[a-z][a-z' -]*$/.test(w)){out.push({raw:s,invalid:true});return}
    if(seen.has(w))return;
    seen.add(w);out.push({w,custom});
  });
  return out;
}
function updateCount(){
  const n=parseInput().filter(x=>!x.invalid).length;
  $("count").textContent=n+" 個單字";
  store.set("vq_words",$("words").value);
}

/* ---------- 翻譯：自訂 > 內建字典 > 快取 > Google > MyMemory ---------- */
const okZh=z=>!!z&&/[\u4e00-\u9fff]/.test(z)&&z.length<=14&&!/[a-zA-Z]{3,}/.test(z);
async function getJSON(url){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),5000);
  try{const r=await fetch(url,{signal:ctl.signal});return await r.json()}
  catch(e){return null}
  finally{clearTimeout(t)}
}
async function apiTranslate(w){
  const q=encodeURIComponent(w);
  const g=await getJSON("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q="+q);
  try{
    const z=g[0].map(x=>x[0]).join("").trim();
    if(okZh(z))return z;
  }catch(e){}
  const m=await getJSON("https://api.mymemory.translated.net/get?q="+q+"&langpair=en|zh-TW");
  try{
    const z=m.responseData.translatedText.trim();
    if(okZh(z))return z;
  }catch(e){}
  return null;
}
async function translate(item){
  if(item.custom)return item.custom;
  if(DICT[item.w])return DICT[item.w];
  let cache={};
  try{cache=JSON.parse(store.get("vq_cache")||"{}")}catch(e){}
  if(cache[item.w])return cache[item.w];
  const z=await apiTranslate(item.w);
  if(z){cache[item.w]=z;store.set("vq_cache",JSON.stringify(cache))}
  return z;
}

/* ---------- 開始測驗 ---------- */
async function begin(){
  const items=parseInput();
  const bad=items.filter(x=>x.invalid).map(x=>x.raw);
  const good=items.filter(x=>!x.invalid);
  msg("homeMsg","","err");
  if(!good.length){msg("homeMsg","請先輸入英文單字（可用逗號或換行分隔）。","err");return}
  if(good.length<4){msg("homeMsg","目前只有 "+good.length+" 個單字，至少需要 4 個才能產生四選一的題目。","err");return}
  const btn=$("start");
  btn.disabled=true;btn.textContent="翻譯中…";
  let done=0;
  const res=await Promise.all(good.map(async x=>{
    const zh=await translate(x);
    done++;btn.textContent="翻譯中… "+done+" / "+good.length;
    return{en:x.w,zh};
  }));
  btn.disabled=false;btn.textContent="開始測驗";
  const ok=res.filter(x=>x.zh),fail=res.filter(x=>!x.zh).map(x=>x.en);
  let note="";
  if(bad.length)note+="已略過格式不正確的內容："+bad.join("、")+"。<br>";
  if(fail.length)note+="以下單字找不到翻譯，已排除："+fail.join("、")+"。（可用「單字=中文」自行指定意思）";
  if(ok.length<4){
    msg("homeMsg",(note?note+"<br>":"")+"可用的單字不足 4 個，無法開始測驗。請增加或修改單字。","err");
    return;
  }
  pool=ok;lastNote=note;
  msg("homeMsg",note,"warn");
  startQuiz(note);
}

function startQuiz(note,subset){
  const base=subset&&subset.length?subset:pool;
  const key=mode==="zh2en"?"en":"zh";
  questions=shuffle(base).map(item=>{
    const seen=new Set([item[key]]),d=[];
    shuffle(pool).forEach(o=>{
      /* 排除同單字、或意思相同的單字，確保只有一個正確答案 */
      if(d.length<3&&o.en!==item.en&&o.zh!==item.zh&&!seen.has(o[key])){seen.add(o[key]);d.push(o[key])}
    });
    return{item,ans:item[key],prompt:mode==="zh2en"?item.zh:item.en,options:shuffle([item[key],...d])};
  }).filter(q=>q.options.length===4);
  if(!questions.length){
    msg("homeMsg","意思重複的單字太多，無法產生四選一題目。請多加入一些不同意思的單字。","err");
    show("home");return;
  }
  idx=0;answers=[];
  msg("quizMsg",note||"","warn");
  show("quiz");render();
}

function render(){
  locked=false;
  const q=questions[idx];
  $("prog").textContent=(idx+1)+" / "+questions.length;
  $("barFill").style.width=(idx/questions.length*100)+"%";
  $("qLabel").textContent=mode==="zh2en"?"請選出正確的英文單字":"請選出正確的中文意思";
  $("qText").textContent=q.prompt;
  const box=$("opts");box.innerHTML="";
  q.options.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="opt";b.dataset.val=o;
    b.innerHTML='<i>'+"ABCD"[i]+'</i><span></span>';
    b.lastChild.textContent=mode==="zh2en"?cap(o):o;
    b.onclick=()=>choose(b,o);
    box.appendChild(b);
  });
  $("fb").className="fb";$("fb").textContent="";
  $("next").style.display="none";
  $("next").textContent=idx===questions.length-1?"查看成績":"下一題";
}

function choose(btn,val){
  if(locked)return;
  locked=true;
  const q=questions[idx],right=val===q.ans;
  answers.push({item:q.item,q:q.prompt,ans:q.ans,pick:val,right});
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.dataset.val===q.ans)b.classList.add("ok");
  });
  if(!right)btn.classList.add("no");
  const fb=$("fb");
  fb.className="fb "+(right?"ok":"no");
  fb.textContent=right?"✓ 答對了！":"✗ 答錯了，正確答案是："+(mode==="zh2en"?cap(q.ans):q.ans);
  $("barFill").style.width=((idx+1)/questions.length*100)+"%";
  const n=$("next");n.style.display="";n.focus();
}
function nextQ(){
  if(idx<questions.length-1){idx++;render()}else showResult();
}

/* ---------- 成績頁 ---------- */
function showResult(){
  const total=answers.length,ok=answers.filter(a=>a.right).length;
  const pct=Math.round(ok/total*100);
  $("rTotal").textContent=total;$("rOk").textContent=ok;$("rBad").textContent=total-ok;
  $("rPct").textContent=pct+"%";
  $("rMsg").textContent=pct===100?"太棒了，全部答對！🌟":pct>=80?"很不錯，繼續保持！":pct>=60?"還可以，再複習一下就更好了。":"別灰心，多練習幾次就會進步。";
  $("retryWrong").style.display=ok<total?"":"none";
  $("onlyWrong").checked=false;
  renderRecords();show("result");
}
function renderRecords(){
  const only=$("onlyWrong").checked,box=$("records");
  box.innerHTML="";
  const list=answers.map((a,i)=>({...a,i})).filter(a=>!only||!a.right);
  if(!list.length){box.innerHTML='<p class="hint">沒有答錯的題目，太厲害了！🌿</p>';return}
  const sh=mode==="zh2en"?cap:(x=>x);
  list.forEach(a=>{
    const d=document.createElement("div");
    d.className="rec "+(a.right?"ok":"no");
    d.innerHTML='<span class="m">'+(a.right?"✓":"✗")+'</span><div></div>';
    d.lastChild.textContent=(a.i+1)+". "+(mode==="zh2en"?a.q:cap(a.q))+" → 正確答案："+sh(a.ans)+(a.right?"":"　｜　你的答案："+sh(a.pick));
    box.appendChild(d);
  });
}

/* ---------- 事件綁定 ---------- */
function setMode(m){
  mode=m;store.set("vq_mode",m);
  document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("sel",b.dataset.mode===m));
}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("words").addEventListener("input",updateCount);
$("sample").onclick=()=>{$("words").value="apple, book, happy, water, beautiful";updateCount()};
$("clear").onclick=()=>{$("words").value="";updateCount();msg("homeMsg","","err")};
$("start").onclick=begin;
$("next").onclick=nextQ;
$("quitQuiz").onclick=()=>show("home");
$("toHome").onclick=()=>show("home");
$("again").onclick=()=>startQuiz(lastNote);
$("retryWrong").onclick=()=>startQuiz(lastNote,answers.filter(a=>!a.right).map(a=>a.item));
$("switch").onclick=()=>{setMode(mode==="zh2en"?"en2zh":"zh2en");startQuiz(lastNote)};
$("onlyWrong").onchange=renderRecords;

document.addEventListener("keydown",e=>{
  if(!$("quiz").classList.contains("on")||locked||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toUpperCase(),i="1234".includes(k)&&k?"1234".indexOf(k):"ABCD".indexOf(k);
  const opts=document.querySelectorAll(".opt");
  if(k.length===1&&i>=0&&opts[i])opts[i].click();
});

(function init(){
  const w=store.get("vq_words");
  $("words").value=w!==null?w:"apple, book, happy, water, beautiful";
  setMode(store.get("vq_mode")==="en2zh"?"en2zh":"zh2en");
  updateCount();
})();
</script>
</body>
